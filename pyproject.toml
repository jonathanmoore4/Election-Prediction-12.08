[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "election-prediction"
version = "0.1.0"
description = "Historical UK general election modelling and prediction pipeline"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pandas",
    "mlflow>=3.5,<4",
    "psycopg2-binary>=2.9,<3",
    "matplotlib",
    "openpyxl",
    "xlrd==2.0.2",
    "lxml",
    "scikit-learn>=1.2",
    "torch",
    "xgboost",
    "scipy>=1.9",
    "numpy>=1.23",
]

[project.optional-dependencies]
notebooks = ["jupyter", "matplotlib", "seaborn", "mistune"]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]
namespaces = false

[tool.setuptools.package-data]
"election.sql" = ["*.sql"]
"election.data" = ["*.xls", "README.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
